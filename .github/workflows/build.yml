name: Build GraceRosaryBoost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name GraceRosaryBoost --icon icon.ico main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GraceRosaryBoost-Windows
          path: dist/GraceRosaryBoost.exe
