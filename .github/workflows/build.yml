name: Build and release GraceRosaryBoost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name GraceRosaryBoost --icon icon.ico main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraceRosaryBoost-Windows
          path: dist/GraceRosaryBoost.exe
          if-no-files-found: error

      - name: Publish v0.0.4 release with EXE
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.0.4 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view v0.0.4 --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
            if ($assets -contains "GraceRosaryBoost.exe") {
              Write-Host "Release v0.0.4 already contains GraceRosaryBoost.exe; nothing to do."
              exit 0
            }
            gh release upload v0.0.4 dist/GraceRosaryBoost.exe --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v0.0.4 dist/GraceRosaryBoost.exe --repo "$env:GITHUB_REPOSITORY" --title "GraceRosaryBoost v0.0.4" --notes "GraceRosaryBoost v0.0.4. Adds a run timer, five visual themes, and configurable Rosary keyboard controls. Download GraceRosaryBoost.exe below."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
